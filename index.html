.card img{

 transform:translateZ(30px)

.card .info{
 padding:20px;text-align:center

.card h4{font-size:1.2rem;margin-bottom:10px}
.card button{
 background:var(--gold);color:#000;

 padding:8px 25px;font-weight:bold;cursor:pointer
